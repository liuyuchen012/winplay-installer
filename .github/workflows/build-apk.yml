name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 缓存签名密钥
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/Xamarin/Mono for Android
            ~/.android
          key: android-debug-keystore-v1

      - name: 安装 android 编译链
        run: dotnet workload install android

      - name: 清理构建缓存
        run: rm -rf bin obj */bin */obj

      - name: 编译 Release APK
        run: >
          dotnet publish -f net10.0-android -c Release
          -p:AndroidPackageFormats=apk
          -p:AndroidPackageFormat=apk
          -o ./publish
          -p:ApplicationVersion=${{ github.run_number }}

      - name: 诊断 - 列出所有 APK/AAB 文件
        run: find . -name "*.apk" -o -name "*.aab" | head -20

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: winplay-installer-apk
          path: '**/*.apk'
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WinPlay Installer v1.0.${{ github.run_number }}
          body: |
            自动构建自 `${{ github.sha }}`
            提交：${{ github.event.head_commit.message || '手动触发' }}
          files: '**/*.apk'
          make_latest: true
